<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Styli Genie</title>
  <link rel="icon" href="/assets/logo.png" type="image/png">
  <link rel="stylesheet" href="/css/design-system.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
  <div class="admin-dashboard">
    <!-- Header -->
    <header class="admin-header">
      <div class="admin-header-inner">
        <div class="logo-area">
          <img src="/assets/logo.png" alt="Styli Genie">
          <span>Styli Genie</span>
          <span class="admin-badge">Owner</span>
        </div>
        <div class="admin-header-actions">
          <button class="theme-toggle" onclick="APP.toggleTheme()">🌙</button>
          <a href="/" class="btn btn-ghost btn-sm">View Store</a>
          <button class="btn btn-outline btn-sm" onclick="adminLogout()">Logout</button>
        </div>
      </div>
    </header>

    <main class="container" style="padding-top:var(--space-md);padding-bottom:var(--space-4xl)">
      <!-- Stats -->
      <div class="admin-stats">
        <div class="stat-card">
          <div class="stat-icon">📦</div>
          <div class="stat-value" id="stat-products">0</div>
          <div class="stat-label">Total Products</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">🛒</div>
          <div class="stat-value" id="stat-orders">0</div>
          <div class="stat-label">Total Orders</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">💰</div>
          <div class="stat-value" id="stat-revenue">₹0</div>
          <div class="stat-label">Revenue</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">⏳</div>
          <div class="stat-value" id="stat-pending">0</div>
          <div class="stat-label">Pending Orders</div>
        </div>
      </div>

      <!-- Tabs -->
      <div class="admin-tabs">
        <button class="admin-tab active" data-tab="tab-products">Products</button>
        <button class="admin-tab" data-tab="tab-orders">Orders</button>
      </div>

      <!-- Products Tab -->
      <div class="tab-content active" id="tab-products">
        <div class="admin-table-header">
          <h3 class="heading-4">All Products</h3>
          <button class="btn btn-accent btn-sm" onclick="showProductModal()">+ Add Product</button>
        </div>
        <div class="admin-table">
          <table>
            <thead>
              <tr>
                <th>Product</th>
                <th>Category</th>
                <th>Price</th>
                <th>Sizes</th>
                <th>Rating</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="products-tbody">
              <tr><td colspan="6" style="text-align:center;padding:var(--space-2xl)">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Orders Tab -->
      <div class="tab-content" id="tab-orders">
        <div class="admin-table-header">
          <h3 class="heading-4">All Orders</h3>
        </div>
        <div class="admin-table">
          <table>
            <thead>
              <tr>
                <th>Order ID</th>
                <th>Customer</th>
                <th>Items</th>
                <th>Total</th>
                <th>Status</th>
                <th>Date</th>
              </tr>
            </thead>
            <tbody id="orders-tbody">
              <tr><td colspan="6" style="text-align:center;padding:var(--space-2xl)">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Product Modal -->
  <div class="modal-overlay" id="product-modal">
    <div class="modal" style="max-width:600px">
      <div class="modal-header">
        <h3>Add Product</h3>
        <button class="modal-close" onclick="closeProductModal()">✕</button>
      </div>
      <form class="product-form" id="product-form" onsubmit="handleProductForm(event)">
        <div class="form-row">
          <div class="input-group">
            <label for="pf-name">Product Name</label>
            <input type="text" id="pf-name" class="input" placeholder="e.g. Oxford Heritage Shirt" required>
          </div>
          <div class="input-group">
            <label for="pf-brand">Brand</label>
            <input type="text" id="pf-brand" class="input" placeholder="e.g. Ralph Lauren">
          </div>
        </div>
        <div class="form-row">
          <div class="input-group">
            <label for="pf-price">Price (₹)</label>
            <input type="number" id="pf-price" class="input" placeholder="e.g. 4999" required>
          </div>
          <div class="input-group">
            <label for="pf-rating">Rating</label>
            <input type="number" id="pf-rating" class="input" placeholder="4.5" step="0.1" min="1" max="5" value="4.5">
          </div>
        </div>
        <div class="input-group">
          <label for="pf-description">Description</label>
          <textarea id="pf-description" class="input" rows="3" placeholder="Premium product description..."></textarea>
        </div>
        <div class="input-group">
          <label>Product Photo</label>
          <div class="admin-photo-uploader">
            <div id="pf-preview" class="photo-preview">
              <span>No Photo</span>
            </div>
            <div class="photo-uploader-actions">
              <div class="input-with-button mb-xs">
                <input type="text" id="pf-image" class="input input-sm" placeholder="Paste image URL here..." title="Direct image URL">
                <button type="button" class="btn btn-outline btn-sm" onclick="document.getElementById('pf-file').click()" title="Upload from computer">📁</button>
              </div>
              <input type="file" id="pf-file" style="display:none" accept="image/*" onchange="handleFileSelect(this)">
              <p style="font-size:var(--fs-xs);color:var(--text-tertiary)">Paste a link or upload from your device.</p>
            </div>
          </div>
        </div>
        <div class="form-row">
          <div class="input-group">
            <label for="pf-category">Category</label>
            <select id="pf-category" class="input">
              <option value="men">Men</option>
              <option value="women">Women</option>
              <option value="casual">Casual</option>
              <option value="premium">Premium</option>
            </select>
          </div>
          <div class="input-group">
            <label for="pf-type">Type</label>
            <select id="pf-type" class="input">
              <option value="shirt">Shirt / Top</option>
              <option value="pants">Pants / Bottom</option>
            </select>
          </div>
        </div>
        <div class="input-group">
          <label>Available Sizes</label>
          <div class="sizes-checkboxes">
            <label class="size-checkbox" data-size="S" onclick="toggleSizeCheckbox(this)"><input type="checkbox" value="S">S</label>
            <label class="size-checkbox" data-size="M" onclick="toggleSizeCheckbox(this)"><input type="checkbox" value="M">M</label>
            <label class="size-checkbox" data-size="L" onclick="toggleSizeCheckbox(this)"><input type="checkbox" value="L">L</label>
            <label class="size-checkbox" data-size="XL" onclick="toggleSizeCheckbox(this)"><input type="checkbox" value="XL">XL</label>
            <label class="size-checkbox" data-size="38" onclick="toggleSizeCheckbox(this)"><input type="checkbox" value="38">38</label>
            <label class="size-checkbox" data-size="40" onclick="toggleSizeCheckbox(this)"><input type="checkbox" value="40">40</label>
            <label class="size-checkbox" data-size="42" onclick="toggleSizeCheckbox(this)"><input type="checkbox" value="42">42</label>
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-full">Save Product</button>
      </form>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/admin.js"></script>
  <script>document.addEventListener('DOMContentLoaded', initDashboard);</script>
</body>
</html>
