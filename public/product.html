<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="View product details — Styli Genie premium fashion">
  <title>Product — Styli Genie</title>
  <link rel="icon" href="/assets/logo.png" type="image/png">
  <link rel="stylesheet" href="/css/design-system.css">
  <link rel="stylesheet" href="/css/products.css">
</head>
<body>
  <!-- Navigation -->
  <nav class="nav" id="main-nav">
    <div class="nav-inner">
      <a href="/" class="nav-logo">
        <img src="/assets/logo.png" alt="Styli Genie">
        <span>Styli Genie</span>
      </a>
      <div class="nav-links" id="nav-links">
        <a href="/">Home</a>
        <a href="/products.html">Shop</a>
        <a href="/products.html?category=men">Men</a>
        <a href="/products.html?category=women">Women</a>
        <a href="/products.html?category=premium">Premium</a>
      </div>
      <div class="nav-actions">
        <button class="theme-toggle" onclick="APP.toggleTheme()">🌙</button>
        <a href="/cart.html" class="btn-icon" style="position:relative;color:var(--text-primary)">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
          <span class="nav-cart-count cart-count-badge" style="display:none">0</span>
        </a>
        <div class="nav-mobile-toggle" id="nav-toggle">
          <span></span><span></span><span></span>
        </div>
      </div>
    </div>
  </nav>

  <main class="product-detail">
    <div class="container" id="product-container">
      <!-- Loading skeleton -->
      <div class="product-detail-grid">
        <div class="skeleton" style="aspect-ratio:4/5;border-radius:var(--radius-xl)"></div>
        <div>
          <div class="skeleton" style="height:16px;width:80px;margin-bottom:16px"></div>
          <div class="skeleton" style="height:14px;width:120px;margin-bottom:12px"></div>
          <div class="skeleton" style="height:36px;width:300px;margin-bottom:12px"></div>
          <div class="skeleton" style="height:28px;width:100px;margin-bottom:20px"></div>
          <div class="skeleton" style="height:80px;width:100%;margin-bottom:16px"></div>
          <div class="skeleton" style="height:52px;width:100%;margin-bottom:16px"></div>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <span>© 2026 Styli Genie. All rights reserved.</span>
      </div>
    </div>
  </footer>

  <script src="/js/app.js"></script>
  <script src="/js/product-detail.js"></script>
</body>
</html>
