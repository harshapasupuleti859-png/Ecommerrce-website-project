<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Browse the complete Styli Genie collection. Filter by brand, category, and price.">
  <title>Shop — Styli Genie</title>
  <link rel="icon" href="/assets/logo.png" type="image/png">
  <link rel="stylesheet" href="/css/design-system.css">
  <link rel="stylesheet" href="/css/products.css">
</head>
<body>
  <!-- Navigation -->
  <nav class="nav" id="main-nav">
    <div class="nav-inner">
      <a href="/" class="nav-logo">
        <img src="/assets/logo.png" alt="Styli Genie">
        <span>Styli Genie</span>
      </a>
      <div class="nav-links" id="nav-links">
        <a href="/">Home</a>
        <a href="/products.html">Shop</a>
        <a href="/products.html?category=men">Men</a>
        <a href="/products.html?category=women">Women</a>
        <a href="/products.html?category=premium">Premium</a>
      </div>
      <div class="nav-actions">
        <button class="theme-toggle" onclick="APP.toggleTheme()">🌙</button>
        <a href="/cart.html" class="btn-icon" style="position:relative;color:var(--text-primary)">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
          <span class="nav-cart-count cart-count-badge" style="display:none">0</span>
        </a>
        <div class="nav-mobile-toggle" id="nav-toggle">
          <span></span><span></span><span></span>
        </div>
      </div>
    </div>
  </nav>

  <main class="products-page">
    <div class="container">
      <!-- Hero -->
      <div class="products-hero">
        <span class="label">Collection</span>
        <h1 class="heading-1 mt-sm">Our Edit</h1>
        <p class="subheading mx-auto mt-md">Every piece curated to perfection. Find what speaks to you.</p>
      </div>

      <!-- Toolbar -->
      <div class="products-toolbar">
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input type="text" id="search-input" placeholder="Search products..." class="input">
        </div>
        <div class="filter-group">
          <button class="filter-btn" data-category="men">Men</button>
          <button class="filter-btn" data-category="women">Women</button>
          <button class="filter-btn" data-category="casual">Casual</button>
          <button class="filter-btn" data-category="premium">Premium</button>
        </div>
        <select class="sort-select" id="sort-select">
          <option value="">Sort by</option>
          <option value="price_asc">Price: Low → High</option>
          <option value="price_desc">Price: High → Low</option>
          <option value="rating">Top Rated</option>
        </select>
      </div>

      <!-- Brand filters -->
      <div class="filter-group mb-lg">
        <button class="filter-btn" data-brand="Ralph Lauren">Ralph Lauren</button>
        <button class="filter-btn" data-brand="U.S. Polo Assn">U.S. Polo</button>
        <button class="filter-btn" data-brand="Wrogn">Wrogn</button>
        <button class="filter-btn" data-brand="Roadster">Roadster</button>
        <button class="filter-btn" data-brand="Levi's">Levi's</button>
        <button class="filter-btn" data-brand="Style Genie">Styli Genie</button>
      </div>

      <div id="products-count" class="products-count"></div>

      <!-- Products Grid -->
      <div class="listing-grid" id="products-grid">
        <!-- Products loaded via JS -->
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <span>© 2026 Styli Genie. All rights reserved.</span>
        <span>Crafted with ❤️ for fashion-forward souls</span>
      </div>
    </div>
  </footer>

  <script src="/js/app.js"></script>
  <script src="/js/products.js"></script>
</body>
</html>
